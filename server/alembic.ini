# Alembic 配置。sqlalchemy.url 留空，由 env.py 从 app.config.settings.DATABASE_URL
# 派生（运行期 asyncmy → 迁移用 sync pymysql），保持单一事实源。
# 运行：在 server/ 目录下 `alembic upgrade head` / `alembic revision --autogenerate -m "..."`

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
