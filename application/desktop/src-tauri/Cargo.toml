[package]
name = "pixelpack-desktop"
version = "1.0.0"
description = "PixelPack 桌面端（Tauri 2 瘦客户端，服务端不变）"
edition = "2021"
rust-version = "1.77"

[lib]
name = "pixelpack_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-store = "2"
tauri-plugin-notification = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-os = "2"
keyring = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# 桌面专属插件门控，为未来移动端复用同一 Rust 核心预留
default = ["desktop"]
desktop = []
