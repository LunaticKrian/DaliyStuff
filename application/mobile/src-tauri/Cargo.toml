[package]
name = "pixelpack-mobile"
version = "1.0.0"
description = "PixelPack 移动端（Tauri 2 瘦客户端 · iOS/Android，服务端不变）"
edition = "2021"
rust-version = "1.77"

[lib]
name = "pixelpack_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-store = "2"
tauri-plugin-os = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# ⚠️ 生物识别（GUILD LOCK）暂未接入：见 commands.rs::authenticate_biometric 与 README。
# 接入时取消注释：
# tauri-plugin-biometric = "2"

[features]
default = []
