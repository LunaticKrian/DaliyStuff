  <symbol id="pi-eye" viewBox="0 0 24 24" fill="currentColor"><path d="M16 20H8v-2h8v2Zm-8-2H4v-2h4v2Zm12 0h-4v-2h4v2ZM4 16H2v-2h2v2Zm10-6h-2v2h2v-2h2v4h-2v2h-4v-2H8v-4h2V8h4v2Zm8 6h-2v-2h2v2ZM2 14H0v-4h2v4Zm22 0h-2v-4h2v4ZM4 10H2V8h2v2Zm18 0h-2V8h2v2ZM8 8H4V6h4v2Zm12 0h-4V6h4v2Zm-4-2H8V4h8v2Z"/></symbol>

  <symbol id="pi-moon" viewBox="0 0 24 24" fill="currentColor"><path d="M18 22H8v-2h10v2ZM8 20H6v-2h2v2Zm12 0h-2v-2h2v2ZM6 18H4v-2h2v2Zm16 0h-2v-4h-2v-2h2v-2h2v8ZM4 16H2V6h2v10Zm14 0h-6v-2h6v2Zm-6-2h-2v-2h2v2Zm-2-2H8V6h2v6ZM6 6H4V4h2v2Zm8-2h-2v2h-2V4H6V2h8v2Z"/></symbol>
  <symbol id="pi-sun" viewBox="0 0 24 24" fill="currentColor"><path d="M11 1h2v3h-2zM5.6 4.2 7 5.6 5.6 7 4.2 5.6zM1 11h3v2H1zm4.6 8.8L7 18.4 5.6 17l-1.4 1.4zM11 20h2v3h-2zm8.4-1.2L18 17l1.4-1.4 1.4 1.4zM20 11h3v2h-3zm-1.4-6.8L17 5.6 18.4 7l1.4-1.4zM8 7h8v10H8z"/></symbol>
</svg>

<div class="phone">
  <div class="bg" aria-hidden="true"><span class="orb a"></span><span class="orb b"></span></div>

  <header class="m-topbar">
    <div class="title" style="display:flex;align-items:center;gap:.5rem"><a style="display:inline-grid;place-items:center;width:30px;height:30px;color:var(--muted)"><svg class="pi"><use href="#pi-arrow-left"/></svg></a><span class="dot"></span>AI 模型配置</div>
    <div class="tools">
      <button class="theme-btn" id="themeBtn" aria-label="切换主题" style="width:34px;height:34px"><svg class="pi moon"><use href="#pi-moon"/></svg><svg class="pi sun"><use href="#pi-sun"/></svg></button>
    </div>
  </header>

  <main class="m-content">

    <!-- 签名：模型链路 HUD 紧凑版 -->
    <div class="px-card dither grad-border" style="margin-bottom:.8rem"><span class="tick tl"></span><span class="tick tr"></span><span class="tick bl"></span><span class="tick br"></span>
      <div class="link-hud" style="padding:1rem 1.1rem;gap:1rem">
        <div class="signal">
          <div class="tower live" id="signalTower" style="height:42px"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i></i></div>
          <div class="slbl">SIGNAL</div>
        </div>
        <div class="core">
          <span class="prov">Anthropic · GLM</span>
          <div class="model grad" style="font-size:1.5rem;margin:.2rem 0">glm-5.2</div>
          <span class="keychip"><svg class="pi sm" style="color:var(--cyan)"><use href="#pi-lock"/></svg> sk-****4f8c</span>
        </div>
        <div class="status">
          <span class="badge success" style="font-size:.58rem"><span class="dot"></span>已启用</span>
        </div>
      </div>
    </div>

    <!-- 连接参数 -->
    <div class="sec-label">连接参数</div>
    <div class="card" style="padding:.9rem;margin-bottom:.8rem">
      <div class="col gap-md">
        <div class="field"><label>服务商</label>
          <div class="input-wrap"><svg class="pi"><use href="#pi-sparkles"/></svg>
            <select class="select"><option selected>Anthropic 兼容（GLM）</option><option>OpenAI 兼容</option></select>
          </div>
        </div>
        <div class="field"><label>模型 Model</label>
          <div class="input-wrap"><svg class="pi"><use href="#pi-target"/></svg><input class="input" value="glm-5.2" /></div>
        </div>
        <div class="field"><label>接口地址</label>
          <div class="input-wrap"><svg class="pi"><use href="#pi-globe"/></svg><input class="input" value="https://open.bigmodel.cn/api/anthropic" /></div>
        </div>
        <div class="field"><label>API 密钥</label>
          <div class="input-wrap key-input"><svg class="pi"><use href="#pi-lock"/></svg>
            <input class="input" id="fKey" type="password" placeholder="留空则不修改" />
            <span class="kctl"><span class="saved">已保存</span><button id="toggleKey" type="button"><svg class="pi sm"><use href="#pi-eye"/></svg></button></span>
          </div>
        </div>
        <div class="grid g-2" style="gap:.6rem">
          <div class="field"><label>最大轮数</label>
            <div class="input-wrap num-suffix"><svg class="pi"><use href="#pi-clipboard"/></svg><input class="input" type="number" value="12" /><span class="sx">轮</span></div>
          </div>
          <div class="field"><label>单次预算</label>
            <div class="input-wrap num-suffix"><svg class="pi"><use href="#pi-coins"/></svg><input class="input" type="number" value="0.5" /><span class="sx">$</span></div>
          </div>
        </div>
        <div class="field"><label>附加系统提示</label>
          <textarea class="textarea" placeholder="可选：自定义人设 / 口吻 / 输出约束"></textarea>
        </div>
        <div class="m-row" style="padding:.5rem 0;border:0">
          <span class="ico"><svg class="pi sm"><use href="#pi-zap"/></svg></span><span class="t">启用此配置</span>
          <label class="toggle"><input type="checkbox" checked><span class="track"></span><span class="thumb"></span></label>
        </div>
      </div>

      <button class="btn btn-primary btn-block" id="testBtn" style="margin-top:.6rem"><svg class="pi"><use href="#pi-zap"/></svg> 测试连接</button>
      <div class="test-result ok show" id="testResult" style="margin-top:.6rem">
        <div class="tr-head"><svg class="pi sm" style="color:var(--success)"><use href="#pi-check"/></svg> 连接成功</div>
        <div class="tr-meta">glm-5.2 · 86ms · token 正常</div>
      </div>
    </div>

    <!-- 用量 -->
    <div class="sec-label">用量与配额 · 本月</div>
    <div class="card" style="padding:.9rem;margin-bottom:.8rem">
      <div class="quota-stat" style="padding:0">
        <div class="top"><span class="v grad">128.4k</span><span class="cap">/ 500k · 25.7%</span></div>
        <div class="barline"><i style="width:25.7%"></i></div>
      </div>
      <div class="quota-stat" style="padding:0;margin-top:.8rem">
        <div class="top"><span class="v">¥2.14</span><span class="cap">/ ¥10 · 21%</span></div>
        <div class="barline"><i style="width:21%;background:var(--success)"></i></div>
      </div>
      <div class="faint mono" style="font-size:.64rem;margin-top:.5rem">配额由站点管理员设置</div>
    </div>

    <!-- 生效范围 -->
    <div class="sec-label">生效范围</div>
    <div class="card" style="padding:.9rem;margin-bottom:1.2rem">
      <div class="scope-list">
        <div class="li"><span class="ck"><svg class="pi sm"><use href="#pi-check"/></svg></span><span class="who">AI 对话<span class="mdl">· glm-5.2</span></span></div>
        <div class="li"><span class="ck"><svg class="pi sm"><use href="#pi-check"/></svg></span><span class="who">简历 AI 编辑<span class="mdl">· glm-5.2</span></span></div>
        <div class="li"><span class="ck"><svg class="pi sm"><use href="#pi-check"/></svg></span><span class="who">每日资讯 intel<span class="mdl">· 定时</span></span></div>
      </div>
    </div>

    <button class="btn btn-primary btn-block" id="saveBtn"><svg class="pi"><use href="#pi-check"/></svg> 保存配置</button>
    <div class="row gap-sm" style="justify-content:center;margin-top:.8rem">
      <span class="badge success" style="font-size:.58rem"><span class="dot"></span>加密存储</span>
      <span class="badge" style="font-size:.58rem">掩码回显</span>
      <span class="badge" style="font-size:.58rem">仅本人可改</span>
    </div>
  </main>

  <nav class="tabbar">
    <a data-view="dashboard"><svg class="pi"><use href="#pi-home"/></svg><span>角色</span></a>
    <a data-view="items"><svg class="pi"><use href="#pi-package"/></svg><span>物品</span></a>
    <a data-view="quests"><svg class="pi"><use href="#pi-clipboard"/></svg><span>委托</span></a>
    <a data-view="chat"><svg class="pi"><use href="#pi-message"/></svg><span>AI</span></a>
    <a data-view="me" class="is-active"><svg class="pi"><use href="#pi-user"/></svg><span>我</span></a>
  </nav>
</div>

<script src="main.js" defer></script>
</body>
</html>
