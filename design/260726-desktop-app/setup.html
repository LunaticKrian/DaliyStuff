<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>PixelPack · 首屏接驳 (Setup)</title>
<link rel="stylesheet" href="styles.css" />
<style>
  /* setup 专属 */
  .setup-card {
    display: grid; grid-template-columns: 320px 1fr; gap: 0;
    min-height: 420px;
  }
  .setup-left {
    padding: 26px 22px;
    background:
      linear-gradient(180deg, rgba(65,166,246,0.06), transparent 60%),
      var(--c-bg);
    border-right: var(--pix-bd);
    display: flex; flex-direction: column; align-items: center; gap: 18px;
    position: relative;
  }
  .setup-left::before {   /* 网格纹理 */
    content: ''; position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
    background-size: 10px 10px; pointer-events: none;
  }
  .setup-left > * { position: relative; z-index: 1; }
  .setup-title { font-family: var(--f-display); font-size: 11px; letter-spacing: 1px; color: var(--c-info); text-align: center; }
  .setup-sub { font-size: 12px; color: var(--c-text-dim); text-align: center; margin-top: -12px; }
  .boot-log {
    width: 100%; flex: 1; padding: 10px 12px;
    background: var(--c-inset); border: var(--pix-bd2);
    font-family: var(--f-mono); font-size: 11px; line-height: 1.7;
    color: var(--c-success); overflow: hidden;
  }
  .boot-log .dim { color: var(--c-text-dim); }
  .boot-log .warn { color: var(--c-warning); }
  .boot-log .info { color: var(--c-info); }
  .caret::after { content: '▮'; color: var(--c-success); animation: blink 0.8s steps(2) infinite; }

  .setup-right { padding: 30px 30px; display: flex; flex-direction: column; gap: 18px; }
  .stage-tab {
    display: flex; gap: 8px; align-items: center;
    font-family: var(--f-display); font-size: 8px; letter-spacing: 1px; color: var(--c-text-dim);
  }
  .stage-tab .s { padding: 4px 8px; background: var(--c-inset); border: 2px solid var(--c-border); }
  .stage-tab .s.done { color: var(--c-success); border-color: var(--c-success); }
  .stage-tab .s.cur { color: var(--c-info); border-color: var(--c-primary); box-shadow: 0 0 6px rgba(65,166,246,0.4); }
  .stage-tab i { color: var(--c-border-2); }

  .form-login { display: none; }
  .form-login.show { display: flex; flex-direction: column; gap: 16px; animation: fade-up 240ms steps(4); }
  .or-line { display: flex; align-items: center; gap: 10px; color: var(--c-text-dim); font-size: 11px; }
  .or-line::before, .or-line::after { content: ''; flex: 1; height: 2px; background: var(--c-border); }
</style>
</head>
<body>
<div class="desktop-bg">

  <div class="win">
    <!-- 标题栏：链路 LED 状态会随握手变化 -->
    <div class="titlebar">
      <div class="titlebar__brand"><span class="titlebar__mark"></span>PIXELPACK</div>
      <div class="titlebar__crumb">终端接驳 · <b>SETUP</b></div>
      <div class="titlebar__spacer"></div>
      <div class="link" id="link"><span class="link__dot"></span><span class="link__txt" id="linkTxt">未接驳</span></div>
      <div class="win-ctrls">
        <button class="win-ctrl" title="最小化">─</button>
        <button class="win-ctrl" title="最小化到托盘">▿</button>
        <button class="win-ctrl win-ctrl--close" title="关闭">✕</button>
      </div>
    </div>

    <div class="setup-card">
      <!-- 左：链路信号塔 + 启动日志 -->
      <div class="setup-left">
        <div>
          <div class="setup-title">TERMINAL LINK</div>
          <div class="setup-sub">接驳公会大厅</div>
        </div>

        <div class="signal" id="signal" title="信号强度">
          <div class="signal__bar"></div>
          <div class="signal__bar"></div>
          <div class="signal__bar"></div>
          <div class="signal__bar"></div>
        </div>

        <div class="boot-log" id="log">
          <div class="dim">&gt; PixelPack Terminal v1.0</div>
          <div class="dim">&gt; 等待公会大厅地址…</div>
          <div class="caret">&gt;</div>
        </div>
      </div>

      <!-- 右：表单（服务器配置 → 登录）-->
      <div class="setup-right">
        <div class="stage-tab">
          <span class="s cur" id="st1">01 · 指定服务器</span>
          <i>▸</i>
          <span class="s" id="st2">02 · 登录冒险者</span>
        </div>

        <!-- 阶段一：服务器地址 + 测试接驳 -->
        <div id="formServer">
          <div class="field" style="margin-bottom:14px">
            <label class="field__label">◈ 公会大厅地址 (SERVER ORIGIN)</label>
            <input class="input" id="origin" value="https://pixelpack.airise.site" placeholder="https://your-host" />
            <span class="hint">仅接受 https:// 生产地址，或 http://localhost 本地调试</span>
          </div>

          <div class="row" style="margin-bottom:14px">
            <div>
              <div class="row__title">记住此服务器</div>
              <div class="row__sub">写入本地配置，下次启动自动接驳</div>
            </div>
            <div class="toggle toggle--on" data-toggle><span class="toggle__track"></span><span class="toggle__knob"></span></div>
          </div>

          <button class="btn btn--primary" id="btnTest" style="width:100%">▶ 测试接驳</button>
        </div>

        <!-- 阶段二：登录（测试通过后显示）-->
        <div class="form-login" id="formLogin">
          <div class="field">
            <label class="field__label">◈ 冒险者账号</label>
            <input class="input" placeholder="username" />
          </div>
          <div class="field">
            <label class="field__label">◈ 密令 (PASSWORD)</label>
            <input class="input" type="password" placeholder="••••••••" />
          </div>
          <button class="btn btn--primary" style="width:100%">▶ 进入公会大厅</button>
          <div class="or-line">或</div>
          <button class="btn btn--ghost">注册新冒险者</button>
          <div class="hint center">令牌将安全存入系统钥匙串 (OS Keychain)，不落明文盘。</div>
        </div>
      </div>
    </div>
  </div>

  <div class="mock-note">设计稿 · setup.html · 首屏接驳</div>
</div>

<script src="main.js"></script>
<script>
  // —— 握手模拟：信号条逐格点亮 + 日志流 ——
  const log = document.getElementById('log');
  const bars = document.querySelectorAll('#signal .signal__bar');
  const link = document.getElementById('link');
  const linkTxt = document.getElementById('linkTxt');
  const btnTest = document.getElementById('btnTest');
  const formServer = document.getElementById('formServer');
  const formLogin = document.getElementById('formLogin');
  const st1 = document.getElementById('st1');
  const st2 = document.getElementById('st2');

  function setLink(state, txt) {
    link.className = 'link link--' + state;
    linkTxt.textContent = txt;
  }

  function pushLine(html, cls='') {
    const caret = log.querySelector('.caret');
    const line = document.createElement('div');
    if (cls) line.className = cls;
    line.innerHTML = html;
    log.insertBefore(line, caret);
    log.scrollTop = log.scrollHeight;
  }

  const steps = [
    [200,  '> 解析地址 <span class="info">pixelpack.airise.site</span>…', 'dim'],
    [500,  '> DNS 解析 OK · 142.93.x.x', ''],
    [400,  '> TLS 握手 …', 'dim'],
    [700,  '> ✓ 证书有效 (Let’s Encrypt · *.airise.site)', 'info'],
    [500,  '> 建立 WSS 信令通道 …', 'dim'],
    [600,  '> 探测 /api/health …', 'dim'],
    [500,  '> <b style="color:var(--c-success)">接驳成功 · LINKED</b>', ''],
  ];

  btnTest.addEventListener('click', () => {
    btnTest.disabled = true;
    setLink('syncing', '握手ing…');
    // 清空信号 + 重置
    bars.forEach(b => b.classList.remove('on'));
    let i = 0;
    const run = () => {
      if (i < steps.length) {
        const [delay, html, cls] = steps[i];
        setTimeout(() => {
          pushLine(html, cls);
          if (i < bars.length) bars[i].classList.add('on');
          i++; run();
        }, delay);
      } else {
        // 全部信号点亮 → 进入登录
        bars.forEach(b => b.classList.add('on'));
        setLink('linked', 'LINKED · 41ms');
        setTimeout(() => {
          formServer.style.display = 'none';
          formLogin.classList.add('show');
          st1.className = 's done'; st1.textContent = '01 · 服务器已接驳';
          st2.className = 's cur';
        }, 500);
      }
    };
    run();
  });
</script>
</body>
</html>
